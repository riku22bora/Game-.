<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Horny Squid 3D Game</title>
<style>
body { margin:0; overflow:hidden; background:#000; }
#ui { position:absolute; top:10px; left:10px; color:#ff00ff; font-size:24px; z-index:10; }
#controls { position:absolute; bottom:30px; left:50%; transform:translateX(-50%); display:flex; gap:30px; z-index:10; }
button { padding:18px 40px; font-size:24px; background:#ff0088; color:white; border:none; border-radius:15px; font-weight:bold; }
#joystick { position:absolute; bottom:150px; left:40px; width:140px; height:140px; background:rgba(255,0,136,0.35); border-radius:50%; border:5px solid #ff00aa; z-index:10; }
#inner { position:absolute; width:55px; height:55px; background:#ff00aa; border-radius:50%; top:42px; left:42px; }
</style>
</head>
<body>
<div id="ui">GREEN → RUN | RED → STOP</div>
<div id="controls">
  <button id="runBtn">▶ RUN</button>
  <button id="stopBtn">■ STOP</button>
</div>
<div id="joystick"><div id="inner"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

camera.position.set(-10, 10, 25);

const light = new THREE.DirectionalLight(0xffffff, 1.4);
light.position.set(10, 25, 15);
scene.add(light);
scene.add(new THREE.AmbientLight(0xaaaaaa));

// Ground
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200,200), new THREE.MeshLambertMaterial({color:0xd4b07c}));
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// Tree
const trunk = new THREE.Mesh(new THREE.CylinderGeometry(1,1.3,10,8), new THREE.MeshLambertMaterial({color:0x2a2a2a}));
trunk.position.set(20,5,-25);
scene.add(trunk);

// Player
const playerTexture = new THREE.TextureLoader().load('player.jpg');
const player = new THREE.Mesh(new THREE.BoxGeometry(2.2, 3.8, 1.8), new THREE.MeshLambertMaterial({map: playerTexture}));
player.position.set(-12, 1.9, 0);
scene.add(player);

// Doll (Tree ke paas)
const dollTexture = new THREE.TextureLoader().load('doll.jpg');
const doll = new THREE.Mesh(new THREE.BoxGeometry(2.8, 4.6, 3.2), new THREE.MeshLambertMaterial({map: dollTexture}));
doll.position.set(20, 2.2, -22);
scene.add(doll);

let move = { forward: false, backward: false, left: false, right: false };
let isGreen = true;
let time = 0;
let gameState = 'playing';

// Reward Video
let rewardVideo = document.createElement('video');
rewardVideo.src = 'reward.mp4';
rewardVideo.loop = true;
rewardVideo.muted = true;
let videoTexture = new THREE.VideoTexture(rewardVideo);
let rewardPlane = null;

function showReward() {
  gameState = 'reward';
  rewardPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(35, 22),
    new THREE.MeshBasicMaterial({map: videoTexture, side: THREE.DoubleSide})
  );
  rewardPlane.position.set(15, 10, -15);
  rewardPlane.rotation.y = Math.PI / 4;
  scene.add(rewardPlane);
  rewardVideo.play();
}

function animate() {
  requestAnimationFrame(animate);

  time++;
  if (time % 85 === 0) isGreen = !isGreen;

  if (isGreen) {
    if (move.forward) player.position.x += 0.35;
    if (move.backward) player.position.x -= 0.25;
    if (move.left) player.position.z -= 0.25;
    if (move.right) player.position.z += 0.25;
  }

  camera.position.x = player.position.x - 12;
  camera.position.z = player.position.z + 25;
  camera.lookAt(player.position.x + 5, 4, player.position.z);

  // Win only when near Tree
  if (player.position.x > 15 && Math.abs(player.position.z + 22) < 8 && gameState === 'playing') {
    showReward();
  }

  renderer.render(scene, camera);
}
animate();

// Controls
document.getElementById('runBtn').addEventListener('mousedown', () => move.forward = true);
document.getElementById('runBtn').addEventListener('mouseup', () => move.forward = false);
document.getElementById('stopBtn').addEventListener('mousedown', () => move.forward = move.backward = move.left = move.right = false);

const joystick = document.getElementById('joystick');
joystick.addEventListener('touchmove', e => {
  let touch = e.touches[0];
  let rect = joystick.getBoundingClientRect();
  let dx = touch.clientX - (rect.left + 70);
  let dy = touch.clientY - (rect.top + 70);
  move.forward = dy < -20;
  move.backward = dy > 20;
  move.left = dx < -20;
  move.right = dx > 20;
});

joystick.addEventListener('touchend', () => {
  move.forward = move.backward = move.left = move.right = false;
});
</script>
</body>
</html>
